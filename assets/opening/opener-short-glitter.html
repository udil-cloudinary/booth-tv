<title>Cloudinary Everywhere Opener Short</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one 1920x1080 stage (TV frame), letterboxed to any viewport. Title left, orbiting logo right. Single dark brand look. */
:root{
  --navy-deep:#141C40; --navy:#1C2A5A; --disc:#15294F; --ink:#FFFFFF; --sky:#1BA1F2; --mist:#C7D6F7;
  --display:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--navy-deep);color:var(--ink);font-family:var(--display);overflow:hidden;padding-inline:0}
#stage{display:block;width:100%;height:100%;cursor:pointer}
#hint{position:fixed;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font:500 12px/1 var(--display);color:var(--mist);opacity:.0;transition:opacity .3s;letter-spacing:.04em}
body:hover #hint{opacity:.55}
#snd{position:fixed;left:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font:500 13px/1 var(--display);color:var(--mist);background:rgba(20,28,64,.55);border:1px solid rgba(199,214,247,.28);border-radius:999px;padding:8px 14px;cursor:pointer;letter-spacing:.03em}
#snd[aria-pressed="true"]{color:var(--ink);border-color:rgba(199,214,247,.6)}
#snd:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.t1{font-weight:800;font-size:132px;letter-spacing:-4.2px;fill:var(--ink)}
.t2{font-weight:800;font-size:132px;letter-spacing:-4.2px;fill:var(--sky)}
.sub{font-weight:500;font-size:36px;letter-spacing:-.3px;fill:var(--mist)}
.tag{font-weight:500;font-size:24px;letter-spacing:.2px;fill:var(--mist);fill-opacity:.72}
</style>

 8.6147,18.573300000000003 L 8.6147,13.603300000000004 A 0.0676,0.0676 0.0 0,1 8.6823,13.537800000000004 L 8.6824,13.5378 M 18.4514,16.084400000000002 L 19.0181,16.084400000000002 A 0.0655,0.0655 0.0 0,0 19.0638,15.971100000000002 L 16.8531,13.762400000000001 L 16.8516,13.760900000000001 A 0.0636,0.0636 0.0 0,0 16.7617,13.762400000000001 L 14.551,15.971 A 0.0657,0.0657 0.0 0,0 14.5967,16.0843 L 15.1534,16.0843 A 0.0656,0.0656 0.0 0,1 15.219,16.1499 L 15.219,18.6607 C 15.219,19.319499999999998 15.753,19.853499999999997 16.4118,19.853499999999997 L 19.0181,19.853499999999997 A 0.0655,0.0655 0.0 0,0 19.0638,19.742199999999997 L 18.733800000000002,19.4122 A 1.1928,1.1928 0.0 0,1 18.385800000000003,18.5732 L 18.385800000000003,16.15 A 0.0656,0.0656 0.0 0,1 18.451500000000003,16.0844 L 18.4514,16.084400000000002 M 13.567,14.810100000000002 L 14.1316,14.810100000000002 A 0.0656,0.0656 0.0 0,0 14.179300000000001,14.698700000000002 L 11.968600000000002,12.496000000000002 L 11.968000000000002,12.495400000000002 A 0.0656,0.0656 0.0 0,0 11.875200000000001,12.496000000000002 L 9.666500000000001,14.702800000000002 A 0.0656,0.0656 0.0 0,0 9.712200000000001,14.814100000000002 L 10.2748,14.814100000000002 A 0.0676,0.0676 0.0 0,1 10.3405,14.881700000000002 L 10.3405,18.660800000000002 C 10.3405,19.3196 10.874500000000001,19.8536 11.5333,19.8536 L 14.1316,19.8536 A 0.0656,0.0656 0.0 0,0 14.179300000000001,19.7423 L 13.8473,19.412300000000002 A 1.193,1.193 0.0 0,1 13.5013,18.573300000000003 L 13.5013,14.877700000000003 C 13.5013,14.841100000000003 13.5304,14.811200000000003 13.567,14.810100000000002"/></g></g></g>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const C={x:1430,y:540};
const S=1.357;                       // logo box (300) to stage scale
const LOOP=7.6;                       // seconds per cycle (short cut)
// The short cut plays the same choreography on a compressed clock: the orbit runs about 3.8x faster.
// Pairs are [short time, original time]; between them time is linear.
const TMAP=[[0,0],[0.5,1.0],[1.7,3.5],[4.9,12.6],[5.3,15.3],[6.0,16.7],[7.6,19.6]];
// Smooth (monotone cubic) clock, so speed eases between sections instead of jumping.
const TM=(()=>{const xs=TMAP.map(p=>p[0]),ys=TMAP.map(p=>p[1]),n=xs.length,d=[],m=[];
  for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
  m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:2/(1/d[i-1]+1/d[i]);   // harmonic mean keeps it monotone
  return {xs,ys,m};})();
function mapT(s){const {xs,ys,m}=TM;
  for(let i=1;i<xs.length;i++){if(s<=xs[i]){const h=xs[i]-xs[i-1],u=(s-xs[i-1])/h,u2=u*u,u3=u2*u;
    return (2*u3-3*u2+1)*ys[i-1]+(u3-2*u2+u)*h*m[i-1]+(-2*u3+3*u2)*ys[i]+(u3-u2)*h*m[i];}}
  return ys[ys.length-1];}
const R_DOT=106*S, DOT_R=11*S, ICON_R=40, R_FLAT=318;
const COL={lav:'#7C8BDD',blue:'#4BA3E8',teal:'#2EC4B6',green:'#63C63F',orange:'#F0A020',pink:'#E24AA1'};
// the six dots of the mark, in logo-box coords
const DOTS={lav:[150,44],blue:[232.87,83.91],teal:[253.34,173.58],green:[195.99,245.5],orange:[104.01,245.5],pink:[46.66,173.59]};
const angOf=([x,y])=>Math.atan2(y-150,x-150);
// one ring, clockwise from the top: 12 surface logos and 3 agent sparks, all on the same orbit
const RING=[
 ['green','green'],['pink','pink'],['claude','spark'],['orange','orange'],['teal','teal'],['wordpress','orange'],['webflow','blue'],['openai','spark'],
 ['contentful','teal'],['shopify','green'],['figma','pink'],['magento','green'],['gemini','spark'],['salesforce','teal'],['contentstack','lav']];
const N=RING.length;
const BEATS={claude:5.4,shopify:7.6,gemini:9.8};   // fewer, longer highlights so they still read at the faster pace
const SPARK_START=[67.12-150,83.91-150];   // the mark's spark, logo-box offset from centre
const SPARK_R=60;                          // agent sparks are bigger than the surface balls (ICON_R 40)

const clamp=v=>v<0?0:v>1?1:v;
const ease=v=>{v=clamp(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>ease((t-a)/(b-a));
const bell=(t,c,w)=>{const d=(t-c)/w;return Math.abs(d)>1?0:.5+.5*Math.cos(Math.PI*d)};
const toward=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d};

const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const back=document.getElementById('back'), front=document.getElementById('front');
const defs=document.querySelector('defs');

// background specks: dots and small sparks that glint (seeded so every load looks the same)
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const specks=document.getElementById('specks'), speckList=[];
const pal=Object.values(COL);
for(let i=0;i<80;i++){
  const x=rnd()*1920,y=rnd()*1080; if(x>960&&Math.hypot(x-C.x,y-C.y)<480) continue;
  if(x<1000&&y>330&&y<800&&x>110) continue;
  const isSpark=i%3===0;
  const g=el('g',{},specks);
  const glint=el('circle',{r:isSpark?26:10,fill:'url(#glint)',opacity:0},g);
  const n=isSpark?el('use',{href:'#sparkShape',fill:'#A58BFF'},g):el('circle',{r:1.8+rnd()*3.6,fill:pal[i%6]},g);
  speckList.push({g,n,glint,x,y,isSpark,ph:rnd()*6.28,fr:0.9+rnd()*1.6,s:isSpark?.2+rnd()*.22:1});
}

const sparkStartAng=Math.atan2(SPARK_START[1],SPARK_START[0]);
const items=RING.map(([id,ck],i)=>{
  const isSpark=ck==='spark';
  const g=el('g',{},front);
  const color=isSpark?'#9575F5':COL[ck];
  const gid='g-'+id, rg=el('radialGradient',{id:gid},defs);
  el('stop',{offset:'0','stop-color':isSpark?'#B8A2FF':color,'stop-opacity':'.8'},rg);
  el('stop',{offset:'1','stop-color':color,'stop-opacity':'0'},rg);
  const o={id,i,isSpark,g,layer:front,beat:BEATS[id],color};
  o.target=-Math.PI/2+i*2*Math.PI/N;
  if(isSpark){
    o.glow=el('circle',{r:SPARK_R*1.9,fill:`url(#${gid})`,opacity:0},g);
    o.rot=el('g',{},g);
    o.thin=el('use',{href:'#sparkShape',fill:'#9575F5'},o.rot);            // the mark's spark
    if(id==='gemini'){   // Gemini's mark is itself a spark, so it is shown on its own
      // Google's colours: blue body, red top, yellow left, green bottom
      o.fat=el('g',{opacity:0},o.rot);
      ['#3186FF','url(#gemRed)','url(#gemYellow)','url(#gemGreen)'].forEach(f=>el('use',{href:'#ic-gemini-c',x:-64,y:-64,width:128,height:128,fill:f},o.fat));
      o.shine=el('use',{href:'#ic-gemini-c',x:-64,y:-64,width:128,height:128,fill:'#FFFFFF',opacity:0,transform:'scale(.9)'},o.rot);
      o.noShine=true;
      o.glyph=el('g',{},g);
    }else{
      o.fat=el('use',{href:'#sparkFat',fill:'#9575F5',opacity:0},o.rot);    // the agent spark
      o.shine=el('use',{href:'#sparkFat',fill:'#D9CCFF',opacity:0,transform:'scale(.92)'},o.rot);
      o.glyph=el('use',{href:'#ic-'+id,x:-21,y:-21,width:42,height:42,opacity:0},g);
    }
    o.parent=sparkStartAng;
    o.flash=el('use',{href:'#sparkShape',fill:'#E4DAFF',opacity:0},o.rot);   // inner shimmer on the mark's spark
    o.ray=el('use',{href:'#sparkShape',fill:'#C9B8FF',opacity:0},g);           // soft long glint
    o.twinkles=[[62,-58,.22,0],[-58,40,.16,.18],[70,46,.13,.34],[-40,-70,.12,.5]].map(([x,y,s,d])=>({n:el('use',{href:'#sparkShape',fill:'#D9CCFF',opacity:0},g),x,y,s,d}));
  }else{
    o.glow=el('circle',{r:ICON_R*1.9,fill:`url(#${gid})`,opacity:0},g);
    el('circle',{r:ICON_R,fill:color},g);
    o.glyph=el('use',{href:'#ic-'+id,x:-ICON_R,y:-ICON_R,width:ICON_R*2,height:ICON_R*2,opacity:0},g);
    o.parent=angOf(DOTS[ck]);
  }
  o.target=toward(o.parent,o.target);
  return o;
});
const sparkItems=items.filter(o=>o.isSpark);

const planetBody=document.getElementById('planetBody'), planetRim=document.getElementById('planetRimC');
const orbitBack=document.getElementById('orbitBack'), orbitFront=document.getElementById('orbitFront');

let curS=null;   // the short clock, set each tick
// the ring turns at one steady speed on the short clock, so it never surges when sections are compressed
// a full turn while the ring is out: a slow base drift plus one smooth extra revolution (eases in and out)
const spinS=s=>0.4*s+8.2*(0.5-0.5*Math.cos(Math.PI*clamp((s-1.3)/4.0)));
function spin(t){ return curS!==null ? spinS(curS) : 0.10*t + 1.15*seg(t,3.6,12.6) + 0.25*seg(t,12.6,15.2); }

const FLASH=t=>bell(t,17.4,0.85);
// a band of light that crosses the title, left to right, after the spark flashes
const sweepG=document.getElementById('sweep'), titleShine=document.getElementById('titleShine');
function sweep(t){
  const k=clamp((t-17.45)/1.25);
  sweepG.setAttribute('gradientTransform',`translate(${(-300+k*1350).toFixed(1)} 0) skewX(-18)`);
  titleShine.setAttribute('opacity',(k>0&&k<1?1:0));
}
// the arrows in the Cloudinary mark glitter in the colour of whatever is being highlighted
const arrowsGlow=document.getElementById('arrowsGlow'), agStops=['ag0','ag1','ag2'].map(i=>document.getElementById(i)), arrGrad=document.getElementById('arrGrad');
const SPARK_COL={claude:'#9575F5',openai:'#9575F5'}, GEM=['#3186FF','#FF4641','#FFD314','#00B95C'];
const mixW=(hex,k)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,f=v=>Math.round(v+(255-v)*k);return `rgb(${f(r)},${f(g)},${f(b)})`;};
function arrowGlitter(t){
  let best=null; items.forEach(o=>{if(o.h>0.02&&(!best||o.h>best.h))best=o;});
  if(!best){arrowsGlow.setAttribute('opacity',0);return;}
  let col=best.isSpark?(SPARK_COL[best.id]||GEM[Math.floor(t*6)%4]):best.color;
  const flick=0.75+0.25*Math.sin(t*37)*Math.sin(t*23);           // fast shimmer
  arrowsGlow.setAttribute('opacity',(Math.min(1,best.h*1.25)*flick).toFixed(3));
  agStops[0].setAttribute('stop-color',col); agStops[1].setAttribute('stop-color',mixW(col,0.5)); agStops[2].setAttribute('stop-color',col);
  arrGrad.setAttribute('gradientTransform',`translate(${((t*2.2)%2-1).toFixed(3)} 0)`);   // a glint travelling across the arrows
}
function frame(t){
  sweep(t);
  const out=seg(t,1.0,2.9), home=seg(t,15.3,16.7), s=out*(1-home);
  const grow=seg(t,2.3,3.5)*(1-seg(t,14.9,15.9));
  // one continuous swell: flat, gently up to the Saturn angle, gently back to flat (no plateaus or corners)
  const tu=clamp((t-3.6)/(12.8-3.6)), tiltK=0.5-0.5*Math.cos(2*Math.PI*tu);
  const planetK=seg(t,3.4,4.8)*(1-seg(t,15.3,16.4));   // back to a flat disc as everything flies home
  const tau=tiltK*64*Math.PI/180, rho=tiltK*-16*Math.PI/180;
  const wob=0;   // no wobble on the fast clock
  const sp=spin(t);
  // the whole orbit expands and contracts together, so it stays one true circle (an ellipse only through the tilt)
  const pulse=seg(t,4.4,5.4)*(1-seg(t,11.6,12.6));
  const Rorb=R_FLAT*lerp(1,1.12,tiltK);   // steady radius, widening only gently with the tilt
  const ct=Math.cos(tau+wob), st=Math.sin(tau+wob), cr=Math.cos(rho), sr=Math.sin(rho);
  const project=(R,a)=>{
    const x=R*Math.cos(a), y=R*Math.sin(a), y2=y*ct, z=Math.sin(a)*st;
    return {x:C.x+x*cr-y2*sr, y:C.y+x*sr+y2*cr, z};
  };

  // planet
  planetBody.setAttribute('opacity',planetK.toFixed(3));
  planetRim.setAttribute('opacity',planetK.toFixed(3));

  // faint orbit track, its far half drawn behind the planet
  if(planetK>0.01&&s>0.99){
    let fb='',ff='';
    for(let j=0;j<=96;j++){const a=j/96*2*Math.PI, p=project(Rorb,a);
      const seg_=`${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
      if(Math.sin(a)<0) fb+=(fb?' L':'M')+seg_; else ff+=(ff?' L':'M')+seg_;}
    orbitBack.setAttribute('d',fb); orbitFront.setAttribute('d',ff);
    const o=(0.16*planetK*Math.min(1,tiltK*3)).toFixed(3);
    orbitBack.setAttribute('opacity',o); orbitFront.setAttribute('opacity',o);
  }else{orbitBack.setAttribute('opacity',0);orbitFront.setAttribute('opacity',0);}

  const order=[];
  items.forEach(o=>{
    const a=lerp(o.parent,o.target+sp,s);
    const p=project(lerp(R_DOT,Rorb,s),a);
    const h=o.beat?bell(t,o.beat,1.5):0;
    const depth=1+0.26*p.z;
    if(o.isSpark){
      const tw=0.5+0.5*Math.sin(t*3.4+o.i);
      // starts as the mark's spark (~102px tall), becomes a bigger agent spark carrying its logo
      const fl=o===sparkItems[0]?FLASH(t):0;
      const k=lerp(1.02,1,grow)*depth*(1+0.06*tw*grow+1.0*h+0.12*fl);
      o.g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(${k.toFixed(3)})`);
      o.rot.setAttribute('transform',`rotate(${(Math.sin(t*1.7+o.i)*8*grow+180*ease(h)+22*Math.sin(Math.PI*clamp((t-16.9)/1.1))).toFixed(1)})`);
      // gentle shine: a lighter core that shimmers, a soft glint, and small sparkles popping around it
      const shimmer=fl*(0.55+0.45*Math.sin(t*14));
      o.flash.setAttribute('opacity',(0.7*shimmer).toFixed(3));
      o.flash.setAttribute('transform','scale(.55)');
      o.ray.setAttribute('opacity',(0.45*fl).toFixed(3));
      o.ray.setAttribute('transform',`rotate(45) scale(${(0.5+0.5*fl).toFixed(3)})`);
      o.twinkles.forEach(w=>{const q=bell(t,16.9+w.d+0.25,0.42)*(o===sparkItems[0]?1:0);
        w.n.setAttribute('opacity',q.toFixed(3));
        w.n.setAttribute('transform',`translate(${w.x} ${w.y}) rotate(${(q*40).toFixed(1)}) scale(${(w.s*(0.3+0.7*q)).toFixed(3)})`);});
      o.thin.setAttribute('opacity',(1-grow).toFixed(3));
      o.fat.setAttribute('opacity',grow.toFixed(3));
      o.shine.setAttribute('opacity',((o.noShine?0.08:0.35)*h).toFixed(3));
      const gIn=clamp((t-3.0-o.i*0.05)/0.45)*(1-clamp((t-14.7)/0.4));
      o.glyph.setAttribute('opacity',gIn.toFixed(3));
      o.glow.setAttribute('opacity',((0.25+0.25*tw)*grow+0.85*h+0.55*fl).toFixed(3));
      o.g.setAttribute('opacity',(o===sparkItems[0]?1:clamp(s*4)).toFixed(3));
    }else{
      const r=lerp(DOT_R,ICON_R,grow);
      const k=(r/ICON_R)*depth*(1+0.8*h);
      o.g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(${k.toFixed(3)})`);
      const gIn=clamp((t-2.9-o.i*0.06)/0.45)*(1-clamp((t-14.7)/0.4));
      o.glyph.setAttribute('opacity',gIn.toFixed(3));
      o.glyph.setAttribute('transform',`scale(${(0.6+0.4*ease(gIn)).toFixed(3)})`);
      o.glow.setAttribute('opacity',(h*0.9).toFixed(3));
    }
    o.h=h;
    order.push([p.z,o]);
  });
  // far side goes behind the planet (it hides them), near side in front; nearer items drawn last
  order.sort((A,B)=>A[0]-B[0]).forEach(([z,o])=>{
    const want=z<-0.001?back:front; want.appendChild(o.g); o.layer=want;
  });

  arrowGlitter(t);
  speckList.forEach(o=>{
    const w=0.5+0.5*Math.sin(t*o.fr*2.2+o.ph);
    const f=Math.pow(w,3);                       // sharp peaks read as sparkle
    o.n.setAttribute('opacity',(0.25+0.75*f).toFixed(3));
    o.glint.setAttribute('opacity',(0.85*f).toFixed(3));
    const sc=o.isSpark?o.s*(0.7+0.8*f):0.8+0.7*f;
    o.g.setAttribute('transform',`translate(${o.x.toFixed(0)} ${o.y.toFixed(0)})`);
    o.n.setAttribute('transform',o.isSpark?`rotate(${(f*45).toFixed(1)}) scale(${sc.toFixed(3)})`:`scale(${sc.toFixed(3)})`);
  });
}

// title comes in once on first load
const title=document.getElementById('title');
// the four lines come in one after another: the two title lines slide in, the two taglines only fade in
const titleLines=[...title.querySelectorAll(':scope > text')];
const LINE_IN=[[0.15,0.85],[0.45,1.15],[0.95,1.6],[1.3,1.95]];
function titleIn(t){
  titleLines.forEach((n,i)=>{const k=seg(t,LINE_IN[i][0],LINE_IN[i][1]);
    n.style.opacity=k.toFixed(3); n.setAttribute('transform',i<2?`translate(${(-34*(1-k)).toFixed(1)} 0)`:'');});
}

// screen time for a full-length time: invert the smooth clock by bisection
function toS(T){let a=0,b=LOOP;for(let i=0;i<40;i++){const m=(a+b)/2;if(mapT(m)<T)a=m;else b=m;}return (a+b)/2;}
const ARP_STEP=0.15;  // sixteenths, the short cut is busier
// ---------- Music: synthesised live with Web Audio, locked to the animation clock ----------
// Score is written against the full-length timeline (seconds T) and placed on screen time with toS(T).
const snd={ctx:null,on:false,cur:-1,buses:[]};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CH={ I:[50,57,61,64,66], vi:[47,54,57,61,62], IV:[43,50,54,57,59], V:[45,52,59,61,66] };
const BELL_NOTES=[74,78,81,83,86,88,90,93];   // D major pentatonic, high
function audioInit(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
  const master=ctx.createGain(); master.gain.value=0.6; master.connect(comp); comp.connect(ctx.destination);
  // reverb: generated stereo impulse
  const len=ctx.sampleRate*3.2, ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const verb=ctx.createConvolver(); verb.buffer=ir; const verbG=ctx.createGain(); verbG.gain.value=0.55; verb.connect(verbG); verbG.connect(master);
  // ping-pong-ish delay for plucks
  const dl=ctx.createDelay(1.5); dl.delayTime.value=0.375; const fb=ctx.createGain(); fb.gain.value=0.32;
  const dlf=ctx.createBiquadFilter(); dlf.type='lowpass'; dlf.frequency.value=2800;
  dl.connect(dlf); dlf.connect(fb); fb.connect(dl); const dlG=ctx.createGain(); dlG.gain.value=0.35; dlf.connect(dlG); dlG.connect(master); dlG.connect(verb);
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  Object.assign(snd,{ctx,master,verb,dl,noise:nb});
}
function newBus(){const g=snd.ctx.createGain(); g.connect(snd.master); g.connect(snd.verb); const dry=snd.ctx.createGain(); dry.gain.value=1; g._send=true; snd.buses.push(g); return g;}
function aEnv(g,t,a,peak,hold,rel){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);}
function aPad(bus,notes,t,dur,vol=0.05){
  const c=snd.ctx, f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(700,t); f.frequency.linearRampToValueAtTime(1500,t+dur*0.6); f.Q.value=0.4;
  const g=c.createGain(); const a=Math.min(0.9,dur*0.35); aEnv(g,t,a,vol,Math.max(0.01,dur-a-0.2),1.1); f.connect(g); g.connect(bus);
  notes.forEach(m=>[-7,7].forEach(det=>{const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=det; o.connect(f); o.start(t); o.stop(t+dur+1.4);}));
}
function aPluck(bus,m,t,vol=0.09){
  const c=snd.ctx, g=c.createGain(); aEnv(g,t,0.004,vol,0,0.42);
  const o=c.createOscillator(); o.type='triangle'; o.frequency.value=mtof(m);
  const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=mtof(m+12); const g2=c.createGain(); g2.gain.value=0.35;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus); g.connect(snd.dl);
  o.start(t); o2.start(t); o.stop(t+0.6); o2.stop(t+0.6);
}
function aBell(bus,m,t,vol=0.08,dec=1.8){
  const c=snd.ctx, car=c.createOscillator(), mod=c.createOscillator(), mg=c.createGain(), g=c.createGain();
  car.frequency.value=mtof(m); mod.frequency.value=mtof(m)*3.5;
  mg.gain.setValueAtTime(mtof(m)*2.2,t); mg.gain.exponentialRampToValueAtTime(1,t+dec);
  mod.connect(mg); mg.connect(car.frequency); car.connect(g); aEnv(g,t,0.003,vol,0,dec); g.connect(bus);
  car.start(t); mod.start(t); car.stop(t+dec+0.1); mod.stop(t+dec+0.1);
}
function aWhoosh(bus,t,dur,up=true,vol=0.05){
  const c=snd.ctx, s=c.createBufferSource(); s.buffer=snd.noise; s.loop=true;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2;
  f.frequency.setValueAtTime(up?300:3200,t); f.frequency.exponentialRampToValueAtTime(up?3200:300,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*0.6); g.gain.linearRampToValueAtTime(0,t+dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t+dur+0.05);
}
function aSub(bus,t,vol=0.22){
  const c=snd.ctx, o=c.createOscillator(), g=c.createGain(); o.type='sine';
  o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(42,t+0.35); aEnv(g,t,0.008,vol,0,0.6);
  o.connect(g); g.connect(snd.master); o.start(t); o.stop(t+0.8);
}
function scheduleCycle(base,from){
  const bus=newBus(), at=T=>base+toS(T), ok=s=>s>=from-0.02;
  const P=(T)=>ok(toS(T));
  const L=toS(19.6);
  // intro chord + fly-out shimmer
  if(P(0))   aPad(bus,CH.I,at(0),toS(3.5),0.035);
  if(P(1.0)) aWhoosh(bus,at(1.0),toS(2.9)-toS(1.0),true,0.05);
  [62,66,69,73,76,78,81,85].forEach((m,i)=>{const T=1.0+i*(1.9/8); if(P(T)) aPluck(bus,m,at(T),0.06);});
  // logos pop in
  for(let i=0;i<15;i++){const T=2.95+i*0.06; if(P(T)) aBell(bus,BELL_NOTES[i%BELL_NOTES.length]-12,at(T),0.025,0.5);}
  // orbit: three chords across the orbit, steady arpeggio on screen time
  const o0=toS(3.5), o1=toS(12.6), seq=[CH.vi,CH.IV,CH.V], part=(o1-o0)/3;
  seq.forEach((ch,k)=>{const s=o0+k*part; if(s>=from-0.02){aPad(bus,ch,base+s,part,0.04); aSub(bus,base+s);}
    const pat=[0,2,4,1,3,4,2,3];
    for(let j=0,s2=s; s2<s+part-0.01; j++, s2+=ARP_STEP){ if(s2>=from-0.02) aPluck(bus,ch[pat[j%8]]+12,base+s2,0.05);}
  });
  // highlight chimes (agents a touch brighter)
  Object.entries(BEATS).forEach(([id,T],i)=>{ if(!P(T))return; const spark=['claude','openai','gemini'].includes(id);
    aBell(bus,BELL_NOTES[(i*3)%BELL_NOTES.length],at(T)-0.05,spark?0.07:0.05,spark?2.2:1.6);
    if(spark) aBell(bus,BELL_NOTES[(i*3+2)%BELL_NOTES.length]+12,at(T)+0.08,0.03,1.4); });
  // settled ring, then home
  if(P(12.6)) aPad(bus,CH.I,at(12.6),toS(16.7)-toS(12.6),0.035);
  if(P(15.3)) aWhoosh(bus,at(15.3),toS(16.7)-toS(15.3),false,0.045);
  [85,81,78,76,73,69,66,62].forEach((m,i)=>{const T=15.3+i*(1.3/8); if(P(T)) aPluck(bus,m,at(T),0.045);});
  // spark shine and title sweep
  [0,0.07,0.15,0.22,0.31,0.4].forEach((d,i)=>{const T=17.15+d*(toS(17.8)-toS(17.15)>0.5?1:0.7); if(P(T)) aBell(bus,BELL_NOTES[(i*2+3)%BELL_NOTES.length]+12,at(T),0.03,1.2);});
  if(P(17.45)) aWhoosh(bus,at(17.45),toS(18.7)-toS(17.45),true,0.03);
  if(P(17.3)){ aPad(bus,[62,69,73,76,78],at(17.3),L-toS(17.3)-0.9,0.03); aBell(bus,74,at(17.3),0.06,2.6); }
}
function audioReset(){ if(!snd.ctx)return; const t=snd.ctx.currentTime; snd.buses.forEach(b=>{b.gain.cancelScheduledValues(t);b.gain.setValueAtTime(b.gain.value,t);b.gain.linearRampToValueAtTime(0,t+0.15);setTimeout(()=>b.disconnect(),400);}); snd.buses=[]; snd.cur=-1; }
function audioTick(el_){
  if(!snd.on)return;
  const c=Math.floor(el_/LOOP), off=el_-c*LOOP, base=snd.ctx.currentTime-off;
  if(snd.cur<c){ scheduleCycle(base,off); snd.cur=c; }
  if(LOOP-off<1.2 && snd.cur<c+1){ scheduleCycle(base+LOOP,0); snd.cur=c+1; }
  if(snd.buses.length>4) snd.buses.splice(0,snd.buses.length-4);
}
const sndBtn=document.getElementById('snd');
function setSound(on){
  if(on&&!snd.ctx) audioInit();
  snd.on=on; sndBtn.setAttribute('aria-pressed',on); sndBtn.textContent=on?'Sound on':'Sound off';
  if(on){ snd.ctx.resume(); snd.cur=-1; } else { audioReset(); }
}
sndBtn.addEventListener('click',e=>{e.stopPropagation(); setSound(!snd.on);});

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search);
let t0=performance.now(), paused=false, pausedAt=0, first=true;
const urlT=parseFloat(params.get('t'));
if(!isNaN(urlT)) t0-=urlT*1000;
function tick(now){
  if(!paused){
    const el_=(now-t0)/1000;
    if(el_>LOOP) first=false;
    titleIn(first?el_:5);
    audioTick(el_);
    curS=el_%LOOP; frame(mapT(curS));
  }
  requestAnimationFrame(tick);
}
if(reduce){titleIn(5);frame(13.6);}  // the settled ring, no motion
else requestAnimationFrame(tick);
window.__frame=(t)=>{paused=true;titleIn(5);frame(t);};   // used for stills

const toggle=()=>{if(reduce)return;paused=!paused;if(paused){pausedAt=performance.now();snd.ctx&&snd.ctx.suspend();}else{t0+=performance.now()-pausedAt;snd.ctx&&snd.on&&snd.ctx.resume();}};
document.getElementById('stage').addEventListener('click',toggle);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();} if(e.key==='r'||e.key==='R'){t0=performance.now();paused=false;first=true;audioReset();snd.ctx&&snd.on&&snd.ctx.resume();} if(e.key==='m'||e.key==='M')setSound(!snd.on);});
})();
</script>
